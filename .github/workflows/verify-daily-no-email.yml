name: Verify Daily Collection No Email

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-daily-no-email.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Seoul

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Run daily collection without email
        run: python news_engine.py daily
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY:         ${{ secrets.CLAUDE_API_KEY }}
          PERPLEXITY_API_KEY:     ${{ secrets.PERPLEXITY_API_KEY }}
          NAVER_CLIENT_ID:        ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:    ${{ secrets.NAVER_CLIENT_SECRET }}
          DISABLE_EMAIL:          '1'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Save DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
