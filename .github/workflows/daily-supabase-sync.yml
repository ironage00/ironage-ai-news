name: Daily Supabase Sync

on:
  schedule:
    - cron: '30 0 * * *'   # 매일 09:30 KST (UTC 00:30)
  workflow_dispatch:        # 수동 실행

env:
  TZ: Asia/Seoul

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv

      - name: Restore SQLite DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Sync SQLite → Supabase (incremental)
        run: python tta-trend-portal/scripts/daily_sync.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
