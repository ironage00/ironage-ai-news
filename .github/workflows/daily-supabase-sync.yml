name: Daily Supabase Sync + Home Cards

on:
  schedule:
    - cron: '30 0 * * *'   # 매일 09:30 KST (UTC 00:30)
  workflow_dispatch:        # 수동 실행

env:
  TZ: Asia/Seoul

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv

      - name: Restore SQLite DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Sync SQLite → Supabase (incremental)
        run: python tta-trend-portal/scripts/daily_sync.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate home-cards.html from Supabase
        run: python tta-trend-portal/scripts/generate_home_cards.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STREAMLIT_URL: ${{ secrets.STREAMLIT_URL }}
          WEEKLY_DOC_URL: ${{ secrets.WEEKLY_DOC_URL }}
          EXCEL_URL: ${{ secrets.EXCEL_URL }}

      - name: Commit updated home-cards.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tta-trend-portal/embeds/home-cards.html
          git diff --cached --quiet && echo "no changes" || \
            git commit -m "auto: regenerate home-cards.html [skip ci]" && \
            git push
