name: Daily News Collection

on:
  workflow_dispatch:        # cron-job.org 또는 수동 실행
    inputs:
      send_email:
        description: 'Send Gmail report after collection'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Seoul

# cron-job.org 중복 트리거 시 동시 실행 방지 (동일 Supabase에 이중 쓰기 차단)
concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # DATABASE_URL 미설정 시 SQLite 폴백으로 조용히 저장·유실되는 사고 방지
      - name: Require DATABASE_URL
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret이 비어 있음 — SQLite 폴백은 러너 종료와 함께 데이터가 유실됩니다."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily collection
        run: python news_engine.py daily
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY:         ${{ secrets.CLAUDE_API_KEY }}
          PERPLEXITY_API_KEY:     ${{ secrets.PERPLEXITY_API_KEY }}
          NAVER_CLIENT_ID:        ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:    ${{ secrets.NAVER_CLIENT_SECRET }}
          GMAIL_SENDER:           ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:         ${{ secrets.GMAIL_PASSWORD }}
          DISABLE_EMAIL:          ${{ github.event.inputs.send_email == 'false' && '1' || '0' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Selection quality report
        if: always()
        continue-on-error: true
        run: |
          python scripts/eval_selection.py --days 7 --summary "$GITHUB_STEP_SUMMARY" \
            || echo "## ⚠️ 선별 품질 리포트 실패 — eval_selection.py 로그 확인 필요" >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 섀도 계측 — 선별점수 × impact 상관 누적 리포트 (심층분석 게이트 컷 확정용)
      - name: Score-impact correlation report
        if: always()
        continue-on-error: true
        run: |
          python scripts/eval_score_impact.py --days 14 --summary "$GITHUB_STEP_SUMMARY" \
            || echo "## ⚠️ score-impact 상관 리포트 실패" >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # 수집이 끝나면 포털(ironage00/tta-trend-portal)의 daily-pipeline을 바로 호출한다.
  # 포털의 GitHub schedule은 매일 5.5~10시간 늦게 돌아 오전 수집분이 오후에야 반영됐다(2026-11).
  # 수집이 실패해도 호출해 포털의 최신성 점검이 즉시 알림을 보내게 한다(포털이 클러스터·스냅샷은 건너뜀).
  # PORTAL_DISPATCH_TOKEN: tta-trend-portal 전용 fine-grained PAT, 권한 Actions: Read and write.
  # 미설정이면 안내만 남기고 성공 처리(포털은 백업 schedule로 동작). 설정됐는데 호출이 실패하면 이 잡이 실패한다.
  notify-portal:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger portal daily pipeline
        env:
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
          COLLECTION_STATUS: ${{ needs.collect.result }}
          BACKEND_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$PORTAL_DISPATCH_TOKEN" ]; then
            echo "::notice::PORTAL_DISPATCH_TOKEN 미설정 — 포털 파이프라인 호출을 건너뜁니다(포털 백업 schedule로 동작)."
            exit 0
          fi
          COLLECTION_DATE=$(TZ=Asia/Seoul date +%F)
          payload=$(printf '{"ref":"main","inputs":{"collection_status":"%s","collection_date":"%s","backend_run_id":"%s"}}' \
            "$COLLECTION_STATUS" "$COLLECTION_DATE" "$BACKEND_RUN_ID")
          curl --fail-with-body --retry 3 --retry-all-errors -sS -X POST \
            -H "Authorization: Bearer $PORTAL_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ironage00/tta-trend-portal/actions/workflows/daily-pipeline.yml/dispatches \
            -d "$payload"
          echo "포털 daily-pipeline 호출 완료 · 수집 결과 $COLLECTION_STATUS · 수집일 $COLLECTION_DATE" >> "$GITHUB_STEP_SUMMARY"
