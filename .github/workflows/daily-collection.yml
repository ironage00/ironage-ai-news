name: Daily News Collection

on:
  schedule:
    - cron: '0 0 * * *'    # 매일 09:00 KST (= 00:00 UTC)
  workflow_dispatch:        # 수동 실행

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB from Google Drive
        run: python scripts/sync_db.py download
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run daily collection
        run: python news_engine.py daily
        env:
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY:         ${{ secrets.CLAUDE_API_KEY }}
          PERPLEXITY_API_KEY:     ${{ secrets.PERPLEXITY_API_KEY }}
          NAVER_CLIENT_ID:        ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:    ${{ secrets.NAVER_CLIENT_SECRET }}
          GMAIL_SENDER:           ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:         ${{ secrets.GMAIL_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Upload DB to Google Drive
        if: always()
        run: python scripts/sync_db.py upload
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
