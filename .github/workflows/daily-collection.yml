name: Daily News Collection

on:
  workflow_dispatch:        # cron-job.org 또는 수동 실행
    inputs:
      send_email:
        description: 'Send Gmail report after collection'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      recipient_override:
        description: 'If set, send ALL unit emails ONLY to this address (comma-separated). Ignores per-unit DB recipients.'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Run daily collection
        run: python news_engine.py daily
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY:         ${{ secrets.CLAUDE_API_KEY }}
          PERPLEXITY_API_KEY:     ${{ secrets.PERPLEXITY_API_KEY }}
          NAVER_CLIENT_ID:        ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:    ${{ secrets.NAVER_CLIENT_SECRET }}
          GMAIL_SENDER:           ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:         ${{ secrets.GMAIL_PASSWORD }}
          DISABLE_EMAIL:          ${{ github.event.inputs.send_email == 'false' && '1' || '0' }}
          EMAIL_OVERRIDE_TO:      ${{ github.event.inputs.recipient_override }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}

      # T11: 임베딩 기반 K-means 클러스터 갱신 (Supabase에 cluster_id/cluster_label 기록)
      # 수집·임베딩 이후 실행. 실패해도 수집 결과에는 영향 없도록 continue-on-error.
      - name: Update article clusters
        continue-on-error: true
        run: python tta-trend-portal/scripts/cluster_articles.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Save DB to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
