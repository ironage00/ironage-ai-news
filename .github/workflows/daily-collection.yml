name: Daily News Collection

on:
  workflow_dispatch:        # cron-job.org 또는 수동 실행
    inputs:
      send_email:
        description: 'Send Gmail report after collection'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Seoul

# cron-job.org 중복 트리거 시 동시 실행 방지 (동일 Supabase에 이중 쓰기 차단)
concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # DATABASE_URL 미설정 시 SQLite 폴백으로 조용히 저장·유실되는 사고 방지
      - name: Require DATABASE_URL
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret이 비어 있음 — SQLite 폴백은 러너 종료와 함께 데이터가 유실됩니다."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily collection
        run: python news_engine.py daily
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY:         ${{ secrets.CLAUDE_API_KEY }}
          PERPLEXITY_API_KEY:     ${{ secrets.PERPLEXITY_API_KEY }}
          NAVER_CLIENT_ID:        ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:    ${{ secrets.NAVER_CLIENT_SECRET }}
          GMAIL_SENDER:           ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD:         ${{ secrets.GMAIL_PASSWORD }}
          DISABLE_EMAIL:          ${{ github.event.inputs.send_email == 'false' && '1' || '0' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TOKEN_JSON:      ${{ secrets.GOOGLE_TOKEN_JSON }}
          # Phase 2.6 선별 모델 실험 — gpt-4o-mini가 283개 규모에서 이틀 연속
          # timeout=120s 초과(재시도 꺼도 재현). 섀도 모드라 뉴스레터엔 무영향.
          # 결과 보고 필요 없어지면 이 줄만 지우면 mini로 복귀.
          SELECTION_OPENAI_MODEL: gpt-4o

      - name: Selection quality report
        if: always()
        continue-on-error: true
        run: |
          python scripts/eval_selection.py --days 7 --summary "$GITHUB_STEP_SUMMARY" \
            || echo "## ⚠️ 선별 품질 리포트 실패 — eval_selection.py 로그 확인 필요" >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
